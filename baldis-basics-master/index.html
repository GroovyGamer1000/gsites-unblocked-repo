<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baldi's Basics Fullscreen</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="baldi.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #gameContainer {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>
<body>
  <div id="gameContainer"></div>

  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "baldi.json", {
      onProgress: UnityProgress,
      Module: {
        preRun: [function() {
          window.addEventListener('resize', function() {
            var canvas = document.querySelector("#gameContainer canvas");
            if (canvas) {
              canvas.style.width = "100%";
              canvas.style.height = "100%";
            }
          });
        }],
        onRuntimeInitialized: function () {
          var canvas = document.querySelector("#gameContainer canvas");
          if (canvas) {
            canvas.style.width = "100%";
            canvas.style.height = "100%";
          }
        }
      }
    });
  </script>
</body>
</html>
